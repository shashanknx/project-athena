<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Ear tufts -->
  <polygon points="18,14 22,4 26,14" fill="#5a1fcc"/>
  <polygon points="38,14 42,4 46,14" fill="#5a1fcc"/>
  <!-- Body -->
  <ellipse cx="32" cy="38" rx="20" ry="22" fill="#863bff"/>
  <!-- Head -->
  <circle cx="32" cy="22" r="18" fill="#863bff"/>
  <!-- Facial disc -->
  <ellipse cx="32" cy="24" rx="14" ry="13" fill="#a96fff"/>
  <!-- Left eye -->
  <circle cx="24" cy="22" r="7" fill="white"/>
  <circle cx="24" cy="22" r="4.5" fill="#1a0040"/>
  <circle cx="25.5" cy="20.5" r="1.2" fill="white"/>
  <!-- Right eye -->
  <circle cx="40" cy="22" r="7" fill="white"/>
  <circle cx="40" cy="22" r="4.5" fill="#1a0040"/>
  <circle cx="41.5" cy="20.5" r="1.2" fill="white"/>
  <!-- Beak -->
  <polygon points="32,27 28,33 36,33" fill="#ffcc44"/>
  <!-- Wing details -->
  <ellipse cx="14" cy="42" rx="6" ry="14" fill="#5a1fcc" transform="rotate(-10 14 42)"/>
  <ellipse cx="50" cy="42" rx="6" ry="14" fill="#5a1fcc" transform="rotate(10 50 42)"/>
  <!-- Feet -->
  <line x1="26" y1="60" x2="22" y2="64" stroke="#ffcc44" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="60" x2="26" y2="64" stroke="#ffcc44" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="60" x2="30" y2="64" stroke="#ffcc44" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="60" x2="34" y2="64" stroke="#ffcc44" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="60" x2="38" y2="64" stroke="#ffcc44" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="60" x2="42" y2="64" stroke="#ffcc44" stroke-width="2" stroke-linecap="round"/>
</svg>
